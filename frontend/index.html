<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <!--
      viewport-fit=cover : 노치가 있는 기기에서 화면 끝까지 그린다.
                           대신 CSS에서 env(safe-area-inset-*)로 여백을 직접 챙겨야 한다.
      maximum-scale 은 넣지 않는다. 확대를 막으면 접근성 위반이다.
      대신 입력칸 글자를 16px 이상으로 둬서 iOS 자동 확대를 막는다(index.css).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>오늘 뭐 먹지?</title>

    <!--
      테마를 React가 뜨기 전에 정한다.
      PrefsContext가 mount될 때 칠하면 그 한 프레임 동안 흰 화면이 번쩍이는데,
      다크 모드를 쓰는 사람에게는 이 깜빡임이 꽤 거슬린다.
      저장값이 없으면 OS 설정을 따르고, 실제 판단 로직은 PrefsContext와 같다.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('meokji.theme')
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          // 저장소가 막힌 브라우저(시크릿 모드 등). 기본값인 라이트로 둔다
        }
      })()
    </script>
    <meta name="description" content="날씨와 취향에 맞춰 오늘 먹을 음식을 추천해드립니다." />

    <!-- 모바일 브라우저 주소창 색. 앱처럼 보이게 하는 데 효과가 크다 -->
    <meta name="theme-color" content="#e8481c" />

    <!-- iOS 홈 화면에 추가했을 때 주소창 없이 전체화면으로 실행된다 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="뭐먹지?" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- 안드로이드/데스크톱에서 '앱 설치'가 가능해진다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
