# 뭐먹지? API 설정.
#
# 비밀번호처럼 사람마다 다른 값은 여기 적지 않는다.
# application-local.yml.example 을 application-local.yml 로 복사해서 쓴다
# (그 파일은 .gitignore 에 있어 커밋되지 않는다).
#
# 파이썬 쪽 backend/.env 와 같은 값을 본다. 두 서버를 같이 띄워 비교할 수
# 있도록 포트만 다르게 뒀다 - 파이썬 8000, 스프링 8080.

spring:
  application:
    name: meokji-api

  profiles:
    # 로컬 개발용 값을 담은 application-local.yml 을 항상 덧씌운다.
    default: local

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    # 서비스 이름 방식이다. SID 방식(@host:port:SID)으로 적으면 ORA-12505 가 난다.
    url: jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:XEPDB1}
    username: ${DB_USER:meokji_app}
    password: ${DB_PASSWORD}
    hikari:
      # XE 는 동시 세션 수에 제약이 있어 작게 잡는다 (파이썬 DB_POOL_SIZE=5 와 같다).
      maximum-pool-size: 5
      connection-timeout: 10000
      # DB 에는 UTC 만 저장한다. 커넥션마다 세션 시간대를 UTC 로 못박는다.
      #
      # 이걸 빼면 오라클 JDBC 가 JVM 기본 시간대(한국)를 세션 시간대로 잡는다.
      # DDL 의 DEFAULT SYS_EXTRACT_UTC(SYSTIMESTAMP) 는 UTC 를 넣는데 애플리케이션이
      # 넣는 값은 KST 가 되어, 같은 표 안에서 9시간 어긋난 행이 섞인다.
      # 에러가 나지 않아서 알아채기 어렵다 (docs/PROGRESS.md 의 오라클 함정 2번).
      connection-init-sql: ALTER SESSION SET TIME_ZONE='+00:00'

  jackson:
    # 프론트가 food_name · cook_time_minutes · has_file 처럼 snake_case 로 읽는다.
    # 자바 필드는 카멜(foodName)로 쓰고 나갈 때만 snake 로 바꾼다.
    #
    # 이 한 줄을 빼면 화면이 빈 값으로 뜨면서 에러도 안 난다. React 가 없는
    # 필드를 읽어 undefined 를 받고 그대로 그리기 때문이다.
    property-naming-strategy: SNAKE_CASE
    # null 인 필드도 그대로 내려보낸다. 파이썬(Pydantic)이 그렇게 주고 있어서,
    # 빼버리면 화면이 "값이 없다" 와 "필드가 없다" 를 구분하지 못한다.
    default-property-inclusion: always
    # 시각을 숫자가 아니라 2026-09-11T21:29:42.955Z 로 쓰는 설정(WRITE_DATES_AS_TIMESTAMPS)은
    # 스프링부트가 이미 꺼둔다. Jackson 3 에서는 이름이 DateTimeFeature 로 옮겨가서
    # spring.jackson.serialization 아래에 적으면 서버가 뜨지 않는다.

mybatis:
  # DB 는 snake_case(FOOD_NAME), 자바는 카멜(foodName). 이 설정이 그 사이를 잇는다.
  configuration:
    map-underscore-to-camel-case: true
    # CLOB 컬럼(recipe_json 등)을 String 으로 받는다.
    jdbc-type-for-null: NULL
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.meokji.api

server:
  port: 8080
  # 파이썬 쪽과 같은 이유로 서버가 만드는 오류 본문을 쓰지 않는다.
  # 우리는 ApiExceptionHandler 에서 {"detail": ...} 하나로만 내려보낸다.
  error:
    whitelabel:
      enabled: false

app:
  name: 뭐먹지? API
  version: 0.1.0
  env: ${APP_ENV:local}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}

  jwt:
    secret-key: ${JWT_SECRET_KEY}
    # 분 단위. 파이썬 JWT_EXPIRE_MINUTES 와 같은 값이어야 한다 -
    # 응답의 expires_in 이 이 값 * 60 으로 나간다.
    expire-minutes: ${JWT_EXPIRE_MINUTES:30}

  weather:
    # mock  : 언제 불러도 28도 맑음. 키가 없어도 화면을 볼 수 있다
    # openweather : 실제 날씨
    provider: ${WEATHER_PROVIDER:mock}
    api-key: ${OPENWEATHER_API_KEY:}

    # 좌표를 안 보냈고 회원 주소도 없을 때 쓸 자리 (서울시청 근처).
    default-lat: ${DEFAULT_WEATHER_LAT:37.5711}
    default-lon: ${DEFAULT_WEATHER_LON:126.9885}

  price:
    # 지금 쓸 수 있는 값은 kamis 하나뿐이다. 값을 지어내던 mock 은 없앴다 -
    # 진짜 조사가격과 화면에서 구분되지 않은 채 합계까지 계산됐다.
    providers: ${PRICE_PROVIDERS:kamis}

    # 공공데이터포털 마이페이지 > 일반 인증키의 Decoding 값.
    # Encoding 값을 넣으면 인증에 실패한다.
    service-key: ${DATA_GO_KR_SERVICE_KEY:}

  # 로그인을 이 횟수만큼 틀리면 계정을 잠근다 (STEP 7).
  max-login-fail-count: ${MAX_LOGIN_FAIL_COUNT:20}

logging:
  level:
    com.meokji.api: DEBUG
    # 매퍼가 실제로 날린 SQL 을 보고 싶을 때 TRACE 로 올린다.
    org.mybatis: INFO
