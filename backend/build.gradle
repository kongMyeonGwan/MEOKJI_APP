plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.meokji'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

// 소스 파일은 UTF-8 이다. 주석과 문자열에 한글이 많아서, 이걸 안 박아두면
// 기계의 기본 문자셋에 따라 javac 가 다르게 읽는다 - 영문 윈도우(cp1252)에서
// 받아 빌드하면 "이미 사용 중인 이메일입니다" 같은 문구가 깨진 채로 컴파일되고,
// 에러가 나지 않아서 응답을 눈으로 보기 전까지 모른다.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Swagger / OpenAPI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	// Spring Security. 로그인 확인(JWT 검사)을 Controller 가 아니라 필터에서 한다.
	//
	// 예전에는 BCrypt 만 쓰려고 spring-security-crypto 하나만 받았는데, 그때는
	// Controller 마다 @RequestHeader("Authorization") 을 받아 직접 토큰을 풀었다.
	// 그 코드가 48곳까지 늘어나서, 새 API 를 만들 때 한 군데만 빠뜨려도 인증 없이
	// 열려버린다. starter 를 받으면 "기본은 전부 차단" 이 되고, 열 주소만
	// SecurityConfig 에 적게 되므로 빠뜨리는 쪽이 안전해진다.
	//
	// starter 안에 spring-security-crypto(BCrypt)가 들어 있어서 따로 받지 않는다.
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// 비밀번호 재설정 인증번호 메일. app.mail.provider=mock 이면 콘솔에 찍고
	// 이 라이브러리를 쓰지 않는다 - 메일 서버 없이도 서버가 뜨고 화면이 돈다.
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// MyBatis. JPA 를 쓰지 않는 이유는 README 와 docs/PROGRESS.md 참고 -
	// 이 스키마는 use_yn 소프트 삭제 · 함수 기반 UNIQUE · MERGE 가 기본이라
	// SQL 을 직접 쓰는 쪽이 맞다.
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'

	// JPA. 매퍼 XML 을 안 쓰는 쪽을 따로 만들 때 쓴다.
	// 지금 표는 전부 MyBatis 로 읽고 쓰므로 ddl-auto 는 none 이다
	// (application.yml 의 spring.jpa).
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Oracle 21c XE. Thin 드라이버라 Instant Client 를 따로 깔지 않는다.
	runtimeOnly 'com.oracle.database.jdbc:ojdbc17'

	// JWT 로그인 토큰 (util/JwtUtil). api 만 컴파일에 쓰고 나머지는 런타임.
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'

	// 테스트에서 MockMvc 에 보안 필터를 붙이는 데 쓴다 (springSecurity()).
	// 이게 없으면 MockMvc 가 Controller 를 바로 부르고 JwtAuthenticationFilter 를
	// 건너뛴다. 그러면 로그인한 사람이 비어 있어서 테스트가 전부 깨진다.
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform {
		// 데모 데이터 채우기(SeedDemoTest)는 빼둔다. 평소 테스트를 돌릴 때마다
		// 회원과 후기를 새로 만들 이유가 없다. 그건 gradlew seedDemo 로 돌린다.
		excludeTags 'seed'
	}

	// 서버가 뜰 때 KAMIS 품목 101개를 훑는 동작을 테스트에서는 끈다.
	// 켜두면 gradlew test 를 돌릴 때마다 바깥 API 를 100번 넘게 두드린다.
	environment 'WARM_BARGAINS', 'false'
}

// 데모 데이터 채우기 (SeedDemoTest 를 돌린다).
//
//     gradlew seedDemo
//
// 빈 DB 로는 화면을 볼 수가 없고, 테스트 85건도 이 계정(minji@example.com)을
// 전제로 돈다. 여러 번 돌려도 안전하다 - 이미 있는 것은 건너뛴다.
tasks.register('seedDemo', Test) {
	group = 'application'
	description = '데모 데이터를 채운다 (회원 · 공지 · 식사 기록 · 후기)'

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	useJUnitPlatform {
		includeTags 'seed'
	}

	environment 'WARM_BARGAINS', 'false'

	// 무엇이 만들어졌는지만 보이게 한다. application.yml 은 매퍼 SQL 까지 찍도록
	// DEBUG 로 두는데, 그러면 "OK 김치찌개" 같은 줄이 SQL 수십 줄에 묻힌다.
	systemProperty 'logging.level.com.meokji.api', 'INFO'
	systemProperty 'logging.level.org.springframework', 'WARN'

	// 만들어진 것을 눈으로 보려고 돌리는 작업이라 출력을 그대로 띄운다.
	testLogging {
		showStandardStreams = true
		events 'failed'
		exceptionFormat = 'full'
	}

	// 내용이 안 바뀌어도 매번 돌아야 한다. DB 상태는 Gradle 이 모른다.
	outputs.upToDateWhen { false }
}
